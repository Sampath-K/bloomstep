<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Bloomstep operator sign-in</title>
<script>
(() => {
  const param = new URLSearchParams(window.location.search).get("scoutTheme");
  const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body><p>Completing operator sign-in. This popup closes when authentication finishes.</p></body></html>
