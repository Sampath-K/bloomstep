name: Offline analytics sandbox proof
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix site --ignore-scripts
      - run: npm run build --prefix site
      - run: node --test test/analytics_sandbox_test.mjs
      - run: node tool/analytics_sandbox_check.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-sandbox-offline-proof
          path: analytics-evidence/
