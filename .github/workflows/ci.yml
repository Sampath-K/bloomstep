name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_aggregates:
        description: 'Run only the real aggregate worker and customer-route isolation proof'
        type: boolean
        default: false
      verify_spend_guard:
        description: 'Run only the read-only free-tier and spending-limit audit'
        type: boolean
        default: false
      verify_native_input:
        description: 'After the existing ARM64 synthetic build, verify owned native focus/input (not customer acceptance)'
        type: boolean
        default: false
      verify_edge_warning:
        description: 'Run only the one bounded preview.8 Edge warning observation'
        type: boolean
        default: false

jobs:
  edge-download-observation:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_edge_warning && !inputs.verify_aggregates && !inputs.verify_spend_guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix site --ignore-scripts
      - name: Observe the exact public preview installer with Edge protections unchanged
        shell: pwsh
        run: |
          $env:BLOOMSTEP_EDGE_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'bloomstep-edge-warning'
          $env:BLOOMSTEP_EDGE_PROFILE_DIR = Join-Path $env:RUNNER_TEMP 'bloomstep-edge-warning-profile'
          node tool/capture_edge_warning.mjs
      - name: Preserve sanitized Edge observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-download-warning-observation
          path: ${{ runner.temp }}/bloomstep-edge-warning/
          if-no-files-found: warn
  spend-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_spend_guard
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/spend-guard.yml
  aggregate-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_aggregates
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aggregates.yml
  api:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_aggregates && !inputs.verify_spend_guard && !inputs.verify_edge_warning)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node ../tool/generate_event_registry.mjs --check
      - run: node --test ../test/universal_installer_test.mjs ../test/release_bundle_test.mjs
      - run: node --test ../test/site_console_test.mjs ../test/measurement_packaging_test.mjs ../test/installer_onboarding_test.mjs ../test/installer_journey_test.mjs ../test/public_claims_test.mjs ../test/identity_callbacks_test.mjs ../test/branding_contract_test.mjs ../test/synthetic_native_contract_test.mjs
      - name: Verify bundled operator authentication
        working-directory: .
        run: |
          npm --prefix site ci
          node --test site/test/*.test.mjs
          npm --prefix site run build
  installer-launch-evidence:
    name: 'launch-after-install: UNVERIFIED (preview gap, owner manual trial pending)'
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_aggregates && !inputs.verify_spend_guard && !inputs.verify_edge_warning)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Verify inert installing-user launch branches without customer data
        id: launch-proof
        shell: pwsh
        env:
          BLOOMSTEP_ISOLATED_JOURNEY_FIXTURE: 'true'
        run: |
          $env:BLOOMSTEP_SOURCE_REVISION = git rev-parse HEAD
          $fixture = Join-Path $env:RUNNER_TEMP 'bloomstep-inert-launch-payload'
          $output = Join-Path $env:RUNNER_TEMP 'bloomstep-inert-launch-installer'
          $evidence = Join-Path $env:RUNNER_TEMP 'bloomstep-inert-launch-evidence'
          New-Item -ItemType Directory -Path $fixture, $evidence, $output -Force | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe "/out:$fixture\bloomstep.exe" tool\fixtures\installer_launch_probe.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DOnboardingJourneyFixture /DAppArch=universal /DAppVersion=0.0.0-contract "/DSourceDirX64=$fixture" "/DSourceDirArm64=$fixture" "/DOnboardingPreprocessOutput=$output\inert-preprocessed.iss" "/O$output" packaging\bloomstep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Get-ChildItem "$output\*.exe").FullName
          $preprocessed = Get-Content "$output\inert-preprocessed.iss" -Raw
          if ($preprocessed -notmatch 'AppId=\{\{A6690692-4D92-475A-9EAC-1AD867AB0635\}' -or
              $preprocessed -notmatch 'AppName=Bloomstep isolated journey proof') {
            throw 'Compiled fixture identity was not explicitly isolated.'
          }
          $manifest = Join-Path $evidence 'compiled-fixture-manifest.json'
          @{
            kind = 'inert-journey-fixture-v1'
            fixtureArch = 'universal'
            sourceRevision = $env:BLOOMSTEP_SOURCE_REVISION
            fixtureAppId = 'A6690692-4D92-475A-9EAC-1AD867AB0635'
            payloadSource = 'tool/fixtures/installer_launch_probe.cs'
            payloadSha256 = (Get-FileHash "$fixture\bloomstep.exe").Hash.ToLower()
            installerFile = [IO.Path]::GetFileName($installer)
            installerSha256 = (Get-FileHash $installer).Hash.ToLower()
            reportedProductName = (Get-Item $installer).VersionInfo.ProductName
          } | ConvertTo-Json | Set-Content $manifest -Encoding utf8
          foreach ($mode in @('checked-launch','unchecked-launch','silent','unattended','cancel','failure','elevated')) {
            & pwsh -NoProfile -File .\tool\verify_installer_journey.ps1 -Installer $installer -FixtureManifest $manifest -EvidenceDir $evidence -Mode $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preserve sanitized inert launch evidence (not app acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomstep-inert-launch-proof-NOT-APP-ACCEPTANCE
          path: ${{ runner.temp }}/bloomstep-inert-launch-evidence/
          if-no-files-found: error
      - name: Report acknowledged owner-trial preview gap
        if: always()
        shell: pwsh
        run: |
          @'
          launch-after-install: UNVERIFIED (preview gap, owner manual trial pending)

          Inert automated proof outcome: ${{ steps.launch-proof.outcome }}.
          No masked failure, no claimed customer-app or launch acceptance.
          Only exact preview.10 and recovery preview.12 have separately authorized owner-trial publication exceptions. Failed preview.11 remains immutable and unpublished.
          The public site remains on preview.9 until both checked/unchecked owner trials pass.
          Before M2/open preview/Store, blocking automated or recorded clean-machine human proof is required again.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
  test-and-build-windows:
    if: github.event_name != 'workflow_dispatch' || (!inputs.verify_aggregates && !inputs.verify_spend_guard && !inputs.verify_edge_warning)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Compile installer contract before native build
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'bloomstep-installer-compile-fixture'
          $output = Join-Path $env:RUNNER_TEMP 'bloomstep-installer-compile-output'
          New-Item -ItemType Directory -Path $fixture, $output -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $fixture 'syntax-probe.txt'), 'Compile-only fixture; never installed or distributed.')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DAppArch=${{ matrix.arch }} /DAppVersion=0.0.0-contract "/DSourceDir=$fixture" "/DOnboardingPreprocessOutput=$output\production-preprocessed.iss" "/O$output" packaging\bloomstep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiledSource = Get-Content "$output\production-preprocessed.iss" -Raw
          if ($compiledSource -match 'Installation is prohibited|8E9B101B-CB3D-4C0F-B733-FC1DFFB75129|A6690692-4D92-475A-9EAC-1AD867AB0635|function PrepareToInstall|isolated journey proof') {
            throw 'Production compile contains capture-only fixture guard or identity.'
          }
      - name: Capture compile-only native Welcome and ordered default-off pages
        shell: pwsh
        run: |
          $env:BLOOMSTEP_SOURCE_REVISION = git rev-parse HEAD
          $fixture = Join-Path $env:RUNNER_TEMP 'bloomstep-installer-compile-fixture'
          $output = Join-Path $env:RUNNER_TEMP 'bloomstep-onboarding-fixture'
          $evidence = Join-Path $env:RUNNER_TEMP 'bloomstep-onboarding-evidence'
          New-Item -ItemType Directory -Path $output, $evidence -Force | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DOnboardingFixture /DAppArch=${{ matrix.arch }} /DAppVersion=0.0.0-contract "/DSourceDir=$fixture" "/DOnboardingPreprocessOutput=$output\fixture-preprocessed.iss" "/O$output" packaging\bloomstep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = (Get-ChildItem "$output\*.exe").FullName
          $preprocessed = Get-Content "$output\fixture-preprocessed.iss" -Raw
          if ($preprocessed -notmatch 'AppId=\{\{8E9B101B-CB3D-4C0F-B733-FC1DFFB75129\}' -or
              $preprocessed -notmatch 'Installation is prohibited; cancel this wizard') {
            throw 'Capture compile must retain its distinct AppId and unconditional installation prohibition.'
          }
          $manifest = Join-Path $output 'capture-fixture-manifest.json'
          @{
            kind = 'compile-only-onboarding-fixture-v1'
            fixtureAppId = '8E9B101B-CB3D-4C0F-B733-FC1DFFB75129'
            installationProhibited = $true
            sourceRevision = $env:BLOOMSTEP_SOURCE_REVISION
            installerFile = [IO.Path]::GetFileName($installer)
            installerSha256 = (Get-FileHash $installer).Hash.ToLower()
            preprocessedSha256 = (Get-FileHash "$output\fixture-preprocessed.iss").Hash.ToLower()
          } | ConvertTo-Json | Set-Content $manifest -Encoding utf8
          if ('${{ matrix.arch }}' -eq 'arm64') {
            & .\tool\verify_onboarding_wizard.ps1 -Installer $installer -FixtureManifest $manifest -EvidenceDir $evidence -AllowUnavailableKeyboard
          } else {
            & .\tool\verify_onboarding_wizard.ps1 -Installer $installer -FixtureManifest $manifest -EvidenceDir $evidence
          }
      - name: Preserve bounded compile-only capture fixture authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomstep-onboarding-capture-fixture-${{ matrix.arch }}-NOT-FOR-RELEASE
          path: ${{ runner.temp }}/bloomstep-onboarding-fixture/
          if-no-files-found: error
      - name: Preserve compile-only wizard evidence (not a public installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomstep-onboarding-${{ matrix.arch }}-NOT-FOR-RELEASE
          path: ${{ runner.temp }}/bloomstep-onboarding-evidence/
          if-no-files-found: error
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: '3.47.6'
          architecture: x64
          cache: true
      - name: Bootstrap supported native ARM64 Dart from Flutter source
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
            throw 'This job requires a real Windows ARM64 host.'
          }
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-arm64'
          git clone --quiet --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Flutter's official bootstrap chooses the native Dart archive using this variable.
          $env:PROCESSOR_ARCHITECTURE = 'ARM64'
          & "$sdk\bin\flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dart = [IO.File]::ReadAllBytes("$sdk\bin\cache\dart-sdk\bin\dart.exe")
          $machine = [BitConverter]::ToUInt16($dart, [BitConverter]::ToInt32($dart, 60) + 4)
          if ($machine -ne 0xaa64) { throw 'Flutter bootstrap did not provide ARM64 Dart.' }
          Add-Content $env:GITHUB_PATH "$sdk\bin"
      - run: flutter pub get
      - run: flutter analyze
      - name: Run app contracts and labeled synthetic profile screenshots
        env:
          BLOOMSTEP_SCREENSHOTS: ${{ runner.temp }}/bloomstep-profile-evidence
        run: flutter test --reporter expanded --concurrency 1 --timeout 60s --dart-define=BLOOMSTEP_TEST_BUILD=true
      - name: Preserve profile UI evidence (synthetic identity, not provider acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-ui-synthetic-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/bloomstep-profile-evidence/profile-*.png
            ${{ runner.temp }}/bloomstep-profile-evidence/picker-*.png
          if-no-files-found: error
      - name: Verify production-mode test-auth and adapter gates
        run: flutter test test/test_auth_release_contract_test.dart --reporter expanded --concurrency 1 --timeout 60s
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install isolated test API dependencies
        run: npm ci --prefix api --ignore-scripts
      - name: Run isolated Windows UI and API acceptance
        id: synthetic-integration
        timeout-minutes: 20
        shell: pwsh
        env:
          BLOOMSTEP_TEST_EVIDENCE_PATH: ${{ runner.temp }}\bloomstep-synthetic-acceptance-details.json
          BLOOMSTEP_TEST_SCREENSHOTS_DIR: ${{ runner.temp }}\bloomstep-v1-compiled-flutter-ui
        run: |
          $env:BLOOMSTEP_SOURCE_REVISION = git rev-parse HEAD
          $bytes = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $key = [BitConverter]::ToString($bytes).Replace('-', '').ToLowerInvariant()
          Write-Output "::add-mask::$key"
          $env:BLOOMSTEP_TEST_AUTH_SECRET = $key
          $exitCode = 1
          try {
            & flutter test integration_test/bloomstep_windows_e2e_test.dart -d windows --dart-define=BLOOMSTEP_TEST_BUILD=true --reporter expanded
            $exitCode = $LASTEXITCODE
          } finally {
            Remove-Item Env:\BLOOMSTEP_TEST_AUTH_SECRET -ErrorAction SilentlyContinue
            [Array]::Clear($bytes, 0, $bytes.Length)
            $key = $null
          }
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Write sanitized synthetic acceptance receipt
        if: always()
        shell: pwsh
        env:
          SYNTHETIC_TEST_OUTCOME: ${{ steps.synthetic-integration.outcome }}
          SOURCE_REVISION: ${{ github.sha }}
          NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          $report = [ordered]@{
            schemaVersion = 1
            sourceRevision = $env:SOURCE_REVISION
            architecture = $env:NATIVE_ARCH
            outcome = $env:SYNTHETIC_TEST_OUTCOME
            test = 'Real Windows Flutter widget journey through a loopback API and production sync/deletion handlers'
            persistence = 'Disposable file-backed Cosmos-compatible test adapter; not Azure Cosmos'
            identity = 'Per-job ephemeral key; synthetic-* owners only; Garden.ReadWrite only'
            excluded = @('Provider federation and MFA', 'Azure Cosmos deployment', 'customer accounts or records', 'Windows notification delivery', 'accessibility evaluation', 'population or cohort outcomes')
            secretIncluded = $false
          }
          $detailsPath = Join-Path $env:RUNNER_TEMP 'bloomstep-synthetic-acceptance-details.json'
          $report.fixtureEvidence = if (Test-Path -LiteralPath $detailsPath) {
            Get-Content -LiteralPath $detailsPath -Raw | ConvertFrom-Json
          } else {
            $null
          }
          $path = Join-Path $env:RUNNER_TEMP 'bloomstep-synthetic-acceptance.json'
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $path -Encoding utf8
      - name: Preserve sanitized synthetic acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomstep-synthetic-acceptance-${{ matrix.arch }}-NOT-PRODUCTION
          path: ${{ runner.temp }}/bloomstep-synthetic-acceptance*.json
          if-no-files-found: error
      - name: Preserve compiled synthetic Flutter builder frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloomstep-v1-compiled-flutter-ui-${{ matrix.arch }}-SYNTHETIC
          path: ${{ runner.temp }}/bloomstep-v1-compiled-flutter-ui/
          if-no-files-found: error
      - name: Build real provider-backed release
        env:
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_API_SCOPE: ${{ vars.OIDC_API_SCOPE }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-preview' }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          flutter build windows --release --dart-define="OIDC_ISSUER=$env:OIDC_ISSUER" --dart-define="OIDC_CLIENT_ID=$env:OIDC_CLIENT_ID" --dart-define="OIDC_API_SCOPE=$env:OIDC_API_SCOPE" --dart-define="API_ORIGIN=$env:API_ORIGIN" --dart-define="BLOOMSTEP_RELEASE_VERSION=$version"
      - name: Verify executable architecture before labeling installer
        shell: pwsh
        run: |
          $binary = [IO.File]::ReadAllBytes("build\windows\${{ matrix.arch }}\runner\Release\bloomstep.exe")
          $machine = [BitConverter]::ToUInt16($binary, [BitConverter]::ToInt32($binary, 60) + 4)
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expected) { throw 'Executable architecture does not match the installer.' }
      - name: Build unsigned preview installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-preview' }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DAppArch=${{ matrix.arch }} "/DAppVersion=$version" packaging\bloomstep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash release-output\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release-output\SHA256-${{ matrix.arch }}.txt
          node tool/release_payload.mjs create "build/windows/${{ matrix.arch }}/runner/Release" "release-output/payload-manifest-${{ matrix.arch }}.json" "${{ matrix.arch }}" (git rev-parse HEAD) $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer lifecycle smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release-output\*.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP 'Bloomstep-smoke'
          $measurement = Join-Path $env:LOCALAPPDATA 'Bloomstep\measurement\installer-receipt.json'
          if (Test-Path $measurement) { throw 'Clean runner already has a measurement receipt; do not overwrite it.' }
          Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait
          if (-not (Test-Path "$target\bloomstep.exe")) { throw 'Install failed' }
          if (Test-Path $measurement) { throw 'Silent install collected measurements without consent.' }
          $protocolKey = 'Registry::HKEY_CURRENT_USER\Software\Classes\bloomstep\shell\open\command'
          $protocol = (Get-Item $protocolKey).GetValue('')
          if ($protocol -ne "`"$target\bloomstep.exe`" `"%1`"") {
            throw 'Per-user invitation protocol was not registered to the installed app.'
          }
          $roaming = [Environment]::GetFolderPath('ApplicationData')
          $legacyData = Join-Path $roaming 'com.bloomstep\bloomstep'
          $brandedData = Join-Path $roaming 'Bloomstep contributors\Bloomstep'
          if (Test-Path $brandedData) { throw 'Storage preservation proof requires a clean runner.' }
          New-Item -ItemType Directory -Path $legacyData -Force | Out-Null
          $storageMarker = Join-Path $legacyData 'storage-identity-smoke.txt'
          if (Test-Path $storageMarker) { throw 'Do not replace an existing storage proof marker.' }
          [IO.File]::WriteAllText($storageMarker, 'Synthetic upgrade fixture; not customer data.')
          $app = Start-Process "$target\bloomstep.exe" -PassThru
          Start-Sleep 8
          if ($app.HasExited) { throw 'Installed app exited unexpectedly' }
          if ((Test-Path $brandedData) -or -not (Test-Path (Join-Path $legacyData 'instance'))) {
            Stop-Process -Id $app.Id
            throw 'Branding relocated the existing Windows storage namespace.'
          }
          if (Test-Path $measurement) { throw 'Default-off first launch manufactured installation observations.' }
          $second = Start-Process "$target\bloomstep.exe" -PassThru
          if (-not $second.WaitForExit(10000)) {
            Stop-Process -Id $second.Id
            throw 'A second launch opened another persistent app instance.'
          }
          if ($second.ExitCode -ne 0) { throw 'Second launch did not activate the existing app.' }
          $code = 'A' * 43
          $invitation = Start-Process "$target\bloomstep.exe" -ArgumentList "bloomstep://invite?code=$code&channel=link" -PassThru
          if (-not $invitation.WaitForExit(10000)) {
            Stop-Process -Id $invitation.Id
            throw 'Invitation launch opened a duplicate app.'
          }
          if ($invitation.ExitCode -ne 0) { throw 'Invitation activation failed.' }
          $app.Refresh()
          if ($app.HasExited) { throw 'Activating the existing app closed its owner.' }
          Stop-Process -Id $app.Id
          # Synthetic previous-consent marker: every upgrade must invalidate it,
          # including silent/default-off upgrades, without inventing a receipt.
          $marker = Join-Path $target 'measurement-owner.txt'
          [IO.File]::WriteAllText($marker, [Guid]::NewGuid().ToString())
          Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait
          if (Test-Path $marker) { throw 'Upgrade inherited a prior installation measurement owner.' }
          if (Test-Path $measurement) { throw 'Silent upgrade manufactured a measurement receipt.' }
          if ([IO.File]::ReadAllText($storageMarker) -ne 'Synthetic upgrade fixture; not customer data.') {
            throw 'Branding altered the synthetic upgrade preservation marker.'
          }
          Remove-Item -LiteralPath $storageMarker
          Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          if (Test-Path "$target\bloomstep.exe") { throw 'Uninstall failed' }
          if (Test-Path $protocolKey) { throw 'Owned invitation protocol survived uninstall.' }
      - uses: actions/upload-artifact@v4
        with:
          name: bloomstep-windows-${{ matrix.arch }}
          path: |
            build/windows/${{ matrix.arch }}/runner/Release/
            release-output/
      - name: Verify optional measurement wizard and genuine installed observations
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release-output\*.exe).FullName
          & .\tool\verify_measurement_install.ps1 -Installer $installer -Target (Join-Path $env:RUNNER_TEMP 'Bloomstep-measurement-smoke')
          $protocolKey = 'Registry::HKEY_CURRENT_USER\Software\Classes\bloomstep\shell\open\command'
          if (Test-Path $protocolKey) { throw 'Owned invitation protocol survived measurement uninstall.' }
      - name: Build isolated Windows runtime probe
        if: matrix.arch == 'arm64'
        run: flutter build windows --profile --target tool/runtime_probe.dart
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: bloomstep-synthetic-runtime-arm64-NOT-FOR-RELEASE
          path: build/windows/arm64/runner/Profile/
      - name: Build isolated synthetic profile preview
        if: matrix.arch == 'arm64'
        run: flutter build windows --profile --target tool/preview.dart
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: bloomstep-synthetic-preview-arm64-NOT-FOR-RELEASE
          path: build/windows/arm64/runner/Profile/
      - name: Verify synthetic native input
        timeout-minutes: 3
        if: matrix.arch == 'arm64' && github.event_name == 'workflow_dispatch' && inputs.verify_native_input
        shell: pwsh
        run: |
          & .\tool\verify_synthetic_input.ps1 -Executable (Join-Path $env:GITHUB_WORKSPACE 'build\windows\arm64\runner\Profile\bloomstep.exe') -Output (Join-Path $env:RUNNER_TEMP 'synthetic-native-input.json')
      - name: Preserve synthetic input outcome, including host failures
        if: always() && matrix.arch == 'arm64' && github.event_name == 'workflow_dispatch' && inputs.verify_native_input
        uses: actions/upload-artifact@v4
        with:
          name: bloomstep-synthetic-input-arm64-NOT-CUSTOMER-ACCEPTANCE
          path: ${{ runner.temp }}/synthetic-native-input.json
          if-no-files-found: warn
  universal-installer:
    needs: [api, test-and-build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bloomstep-windows-*
          path: artifacts
      - name: Install and record supported Inno compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $compiler = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          @{
            executable = $compiler.Name
            fileVersion = $compiler.VersionInfo.FileVersion
            productVersion = $compiler.VersionInfo.ProductVersion
            fileMajorPart = $compiler.VersionInfo.FileMajorPart
            fileMinorPart = $compiler.VersionInfo.FileMinorPart
            executableSha256 = (Get-FileHash $compiler.FullName).Hash.ToLower()
          } | ConvertTo-Json -Compress | Write-Output
          . .\tool\inno_compiler_version.ps1
          & $compiler.FullName packaging\inno-toolchain-probe.iss | Tee-Object -Variable engineOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Compile-only Inno toolchain probe failed with exit $LASTEXITCODE; no installer output was requested."
          }
          $engineVersion = Get-InnoEngineVersion @($engineOutput)
          Write-Output "Verified Inno compiler engine: $engineVersion"
          "BLOOMSTEP_INNO_ENGINE_VERSION=$engineVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify genuine same-source Release inputs and compile offline universal setup
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-preview' }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $source = git rev-parse HEAD
          $roots = @{}
          foreach ($arch in @('x64','arm64')) {
            $roots[$arch] = Join-Path $PWD "artifacts\bloomstep-windows-$arch\build\windows\$arch\runner\Release"
            $manifest = Join-Path $PWD "artifacts\bloomstep-windows-$arch\release-output\payload-manifest-$arch.json"
            node tool/release_payload.mjs verify $roots[$arch] $manifest $arch $source $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $output = Join-Path $PWD 'universal-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DAppArch=universal "/DAppVersion=$version" "/DSourceDirX64=$($roots.x64)" "/DSourceDirArm64=$($roots.arm64)" "/O$output" packaging\bloomstep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-Item "$output\Bloomstep-$version-windows-universal-setup.exe"
          $hash = (Get-FileHash $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$output\SHA256-universal.txt" -Encoding utf8
          $payloadHashes = @{}
          foreach ($arch in @('x64','arm64')) {
            $payloadHashes[$arch] = (Get-FileHash "artifacts\bloomstep-windows-$arch\release-output\payload-manifest-$arch.json").Hash.ToLower()
          }
          @{
            kind = 'bloomstep-offline-universal-v1'; source = $source; version = $version
            installerFile = $installer.Name; installerSha256 = $hash; bytes = $installer.Length
            compiler = $env:BLOOMSTEP_INNO_ENGINE_VERSION
            signatureStatus = (Get-AuthenticodeSignature $installer.FullName).Status.ToString()
            payloadManifests = $payloadHashes
          } | ConvertTo-Json -Depth 4 | Set-Content "$output\universal-manifest.json" -Encoding utf8
          foreach ($arch in @('x64','arm64')) {
            Copy-Item "artifacts\bloomstep-windows-$arch\release-output\payload-manifest-$arch.json" $output
          }
          Write-Output "Offline universal installer compressed bytes: $($installer.Length)"
      - name: Compile real native x64 host-query probe, never a release asset
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'native-probe-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Existing x64 MSVC toolchain required for a native (not managed) process probe.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $source = Join-Path $PWD 'tool\fixtures\native_architecture_probe.cpp'
          $probe = Join-Path $output 'native-host-x64-probe.exe'
          $object = Join-Path $env:RUNNER_TEMP 'native-host-x64-probe.obj'
          & $env:ComSpec /d /s /c "call `"$vcvars`" >nul && cl /nologo /W4 /WX /EHsc /MT `"$source`" /Fo`"$object`" /Fe`"$probe`" /link /NOLOGO"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            kind = 'native-x64-host-query-probe-v1'; source = (git rev-parse HEAD)
            sourceFile = 'tool/fixtures/native_architecture_probe.cpp'
            sourceSha256 = (Get-FileHash $source).Hash.ToLower()
            probeSha256 = (Get-FileHash $probe).Hash.ToLower()
            visualStudioVersion = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion)
          } | ConvertTo-Json | Set-Content "$output\native-probe-manifest.json" -Encoding utf8
      - name: Compile isolated checksum fault-injection fixture, never a release asset
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'universal-integrity-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $marker = Join-Path $env:RUNNER_TEMP 'universal-integrity-marker.txt'
          [IO.File]::WriteAllText($marker, ('BLOOMSTEP-INERT-INTEGRITY-MARKER-' + [guid]::NewGuid().ToString()) * 64)
          $x64 = Join-Path $PWD 'artifacts\bloomstep-windows-x64\build\windows\x64\runner\Release'
          $arm64 = Join-Path $PWD 'artifacts\bloomstep-windows-arm64\build\windows\arm64\runner\Release'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp /DOnboardingJourneyFixture /DUniversalIntegrityFixture /DAppArch=universal /DAppVersion=0.0.0-contract "/DIntegrityMarker=$marker" "/DSourceDirX64=$x64" "/DSourceDirArm64=$arm64" "/DOnboardingPreprocessOutput=$output\fixture-preprocessed.iss" "/O$output" packaging\bloomstep.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiled = Join-Path $output 'Bloomstep-0.0.0-contract-windows-universal-setup.exe'
          if ((Get-Content "$output\fixture-preprocessed.iss" -Raw) -notmatch 'AppId=\{\{A6690692-4D92-475A-9EAC-1AD867AB0635\}') {
            throw 'Checksum fault fixture must retain its distinct isolated AppId.'
          }
          $corrupt = Join-Path $output 'isolated-corrupted-setup.exe'
          node tool/corrupt_fixture_payload.mjs $compiled $marker $corrupt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            kind = 'isolated-embedded-checksum-fault-v1'; source = (git rev-parse HEAD)
            fixtureAppId = 'A6690692-4D92-475A-9EAC-1AD867AB0635'
            installerSha256 = (Get-FileHash $corrupt).Hash.ToLower()
            reportedProductName = (Get-Item $corrupt).VersionInfo.ProductName
          } | ConvertTo-Json | Set-Content "$output\integrity-manifest.json" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: bloomstep-universal-installer
          path: universal-output/
      - uses: actions/upload-artifact@v4
        with:
          name: universal-native-host-query-NOT-APP
          path: native-probe-output/
      - uses: actions/upload-artifact@v4
        with:
          name: universal-integrity-fixture-NOT-FOR-RELEASE
          path: |
            universal-integrity-output/isolated-corrupted-setup.exe
            universal-integrity-output/integrity-manifest.json
  universal-native-proof:
    needs: universal-installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: bloomstep-universal-installer
          path: universal-output
      - uses: actions/download-artifact@v4
        with:
          name: universal-integrity-fixture-NOT-FOR-RELEASE
          path: universal-integrity-output
      - uses: actions/download-artifact@v4
        with:
          name: universal-native-host-query-NOT-APP
          path: native-probe-output
      - name: Verify offline native routing and disposable installer lifecycle
        shell: pwsh
        run: |
          & .\tool\verify_universal_installer.ps1 -PackageDir (Join-Path $PWD 'universal-output') -ExpectedArch '${{ matrix.arch }}' -EvidenceDir (Join-Path $env:RUNNER_TEMP 'universal-native-evidence')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-native-${{ matrix.arch }}-NOT-CUSTOMER-ACCEPTANCE
          path: ${{ runner.temp }}/universal-native-evidence/
          if-no-files-found: error
  universal-app-launch-evidence:
    name: 'genuine universal app checked/unchecked launch (${{ matrix.arch }})'
    needs: universal-installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: bloomstep-universal-installer
          path: universal-output
      - name: Actual genuine app launch requires a clean non-elevated installing user
        shell: pwsh
        env:
          BLOOMSTEP_UNIVERSAL_APP_PROOF: 'true'
        run: |
          & .\tool\verify_universal_app_launch.ps1 -PackageDir (Join-Path $PWD 'universal-output') -ExpectedArch '${{ matrix.arch }}' -EvidenceDir (Join-Path $env:RUNNER_TEMP 'genuine-universal-launch-evidence')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-universal-launch-${{ matrix.arch }}-NOT-FULL-OWNER-ACCEPTANCE
          path: ${{ runner.temp }}/genuine-universal-launch-evidence/
          if-no-files-found: error
  release:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.api.result == 'success' && needs.test-and-build-windows.result == 'success' &&
      needs.universal-native-proof.result == 'success' &&
      (needs.universal-app-launch-evidence.result == 'success' || github.ref_name == 'v0.1.0-preview.12') &&
      (needs.installer-launch-evidence.result == 'success' || github.ref_name == 'v0.1.0-preview.10' || github.ref_name == 'v0.1.0-preview.12')
    needs: [api, test-and-build-windows, installer-launch-evidence, universal-native-proof, universal-app-launch-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bloomstep-windows-*
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: bloomstep-universal-installer
          path: universal-output
      - uses: actions/download-artifact@v4
        with:
          name: universal-native-x64-NOT-CUSTOMER-ACCEPTANCE
          path: native-x64
      - uses: actions/download-artifact@v4
        with:
          name: universal-native-arm64-NOT-CUSTOMER-ACCEPTANCE
          path: native-arm64
      - uses: actions/download-artifact@v4
        with:
          name: genuine-universal-launch-x64-NOT-FULL-OWNER-ACCEPTANCE
          path: launch-x64
      - uses: actions/download-artifact@v4
        with:
          name: genuine-universal-launch-arm64-NOT-FULL-OWNER-ACCEPTANCE
          path: launch-arm64
      - name: Bind publication to one run and exact elevated-guard exception
        env:
          GENUINE_RESULT: ${{ needs.universal-app-launch-evidence.result }}
        run: node tool/release_bundle.mjs . "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GENUINE_RESULT"
      - name: Publish preview (not the authenticated MVP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Bloomstep $GITHUB_REF_NAME - owner trial only"
          notes="Unsigned Windows engineering preview with real broker sign-in; provider availability depends on the configured customer flow. No anonymous or simulated login. This is NOT the complete verified MVP. See docs/status.md for actual evidence, runtime limits and outstanding launch gates. Verify the downloadable SHA-256 before installing."
          if [ "$GITHUB_REF_NAME" = "v0.1.0-preview.10" ] || [ "$GITHUB_REF_NAME" = "v0.1.0-preview.12" ]; then
            title="Bloomstep $GITHUB_REF_NAME - owner trial only"
            notes="$notes

          launch-after-install: not yet verified, pending owner manual trial
          genuine launch-after-Finish: UNVERIFIED

          Owner trial only; this GitHub prerelease is publicly accessible, not private. No external recruitment. The public site remains on preview.9 until the owner reports both paths pass: checked Finish starts exactly one non-elevated app as the installing user, and unchecked Finish starts no app. Sign-in remains required before the builder. Either failure is a P0 frozen-v1 fix in the next preview. Recovery preview.12 has separate authorization only for this manual owner-test candidate after the preview.11 publication validator rejected a scalar checksum receipt; failed preview.11 stays immutable and unpublished. The elevated hosted genuine-launch worker stopped before installation, not a launch pass. No general future release exception. Before M2/open preview/Store, blocking automated or recorded clean-machine human launch proof is required again."
          fi
          notes="$notes

          Primary Windows download: Bloomstep-${GITHUB_REF_NAME#v}-windows-universal-setup.exe. Self-contained offline installer with native Windows x64/ARM64 routing, including emulated setup processes. No architecture selection or runtime payload download. Per-architecture installers are secondary support assets. SHA-256 records establish byte consistency, not safety or digital signing.

          Owner trial candidate, not guaranteed customer-v1 final. No external recruitment. The public website stays on preview.9 until separately agreed owner checked/unchecked launch and ordinary sign-in/full journey pass. Promote these same verified immutable binaries if accepted, not a rebuild. No animation added; illustrated static cards and full garden are retained."
          notes="$notes

          $(cat release-proof/evidence-notes.md)"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes" universal-output/*.exe universal-output/SHA256-universal.txt universal-output/universal-manifest.json universal-output/payload-manifest-*.json release-proof/*.json release-proof/*.png release-proof/owner-trial-checklist.md $(find artifacts -name '*.exe' -path '*/release-output/*') $(find artifacts -name 'SHA256-*.txt')
