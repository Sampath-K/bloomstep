name: Deploy free preview website and API
on:
  push:
    branches: [main, sampath-k-bloomstep-mvp-implementation]
    paths: ['site/**', 'api/**', '.github/workflows/azure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify private API contracts
        working-directory: api
        run: npm ci --ignore-scripts && npm run check && npm test
      - name: Deploy approved Free SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          output_location: ''
          skip_app_build: true
          production_branch: sampath-k-bloomstep-mvp-implementation
