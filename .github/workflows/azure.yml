name: Deploy free preview website and API
on:
  push:
    branches: [main]
    paths: ['site/**', 'api/**', 'shared/**', 'tool/generate_event_registry.mjs', '.github/workflows/azure.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: budlark-production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify private API contracts
        working-directory: api
        run: npm ci --ignore-scripts && npm run check && npm test
      - name: Verify generated event registry
        run: node tool/generate_event_registry.mjs --check
      - name: Verify and build real operator sign-in
        env:
          CONSOLE_CLIENT_ID: ${{ vars.CONSOLE_CLIENT_ID }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_API_SCOPE: ${{ vars.OIDC_API_SCOPE }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          npm --prefix site ci
          node --test site/test/*.test.mjs test/site_console_test.mjs
          npm --prefix site run build
          mkdir deploy-site
          cp site/index.html site/console.html site/robots.txt site/sitemap.xml site/config.json site/staticwebapp.config.json site/operator-callback.html site/operator-config.json deploy-site/
          cp -R site/assets deploy-site/assets
          cp -R site/releases deploy-site/releases
      - name: Verify authorized internal dogfood artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/stage-downloads.mjs --verify-source
      - name: Download immutable internal dogfood artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Sampath-K/bloomstep
          run-id: 39134443648
          artifact-ids: 12140076664
          merge-multiple: true
          path: dogfood-artifact
      - name: Stage only hash-verified internal dogfood installer
        run: node site/stage-downloads.mjs dogfood-artifact deploy-site/downloads
      - name: Deploy approved Free SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          production_branch: main
          app_location: deploy-site
          api_location: api
          output_location: ''
          skip_app_build: true
      - name: Verify served protected routes, not just deployment status
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          for route in sync team/feedback team/metrics team/website invitations invitations/status invitations/redeem internal/aggregates internal/website-proof internal/operational-pause team/operational-resume; do
            method=GET
            case "$route" in
              invitations|invitations/redeem|internal/aggregates|internal/operational-pause|team/operational-resume) method=POST;;
            esac
            matched=false
            for attempt in $(seq 1 12); do
              status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request "$method" "$API_ORIGIN/api/$route")
              if [ "$status" = 401 ]; then matched=true; break; fi
              sleep 10
            done
            if [ "$matched" != true ]; then
              echo "::error::Protected $route returned HTTP $status instead of 401."
              exit 1
            fi
          done
      - name: Verify direct hosted dogfood bytes
        run: |
          node -e "for (const f of require('./site/downloads.json').files) console.log(f.publicName, f.bytes, f.sha256)" |
          while read -r name bytes sha; do
            url="https://budlark.com/downloads/$name"
            matched=false
            for attempt in $(seq 1 12); do
              status=$(curl --silent --show-error --proto '=https' --max-time 120 --output hosted-download.bin --dump-header hosted-download.headers --write-out '%{http_code}' "$url") || status=000
              if [ "$status" = 200 ] && ! grep -qi '^location:' hosted-download.headers \
                && [ "$(stat -c %s hosted-download.bin)" = "$bytes" ] \
                && [ "$(sha256sum hosted-download.bin | cut -d' ' -f1)" = "$sha" ]; then matched=true; break; fi
              sleep 10
            done
            if [ "$matched" != true ]; then echo "::error::Dogfood download failed direct-200 integrity verification: $url (HTTP $status)"; exit 1; fi
          done
