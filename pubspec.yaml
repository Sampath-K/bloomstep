name: bloomstep
description: "Bloomstep - grow tiny habits into a flourishing garden."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.3
  crypto: ^3.0.7
  http: ^1.6.0
  openid_client: ^0.4.9
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  file_selector: ^1.1.0
  flutter_local_notifications: ^22.3.1
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - windows/runner/resources/app_icon.ico
